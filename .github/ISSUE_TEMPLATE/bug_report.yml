name: Bug report
description: Something in Grain behaves differently than documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. A short reproduction helps more than anything else.

  - type: input
    id: version
    attributes:
      label: Grain version
      placeholder: "0.2.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How are you loading Grain?
      options:
        - CDN (<script> and <link>)
        - npm with a bundler
        - npm with a server-rendered framework
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Safari 17.4"
    validations:
      required: true

  - type: textarea
    id: markup
    attributes:
      label: Markup that reproduces it
      description: The smallest snippet that shows the problem.
      render: html
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true

  - type: input
    id: demo
    attributes:
      label: Live reproduction
      description: Optional, but it speeds things up a lot.
      placeholder: https://codepen.io/...
