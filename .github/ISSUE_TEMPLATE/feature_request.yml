name: Feature request
description: Suggest a component, variant, or token.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: Describe the use case rather than the implementation.
    validations:
      required: true

  - type: textarea
    id: markup
    attributes:
      label: What would the markup look like?
      description: >
        Grain treats semantic HTML as its API, so the shape of the markup is
        the design. Sketch how you would want to write it.
      render: html

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: Existing components, token overrides, or custom CSS.

  - type: checkboxes
    id: constraints
    attributes:
      label: Fit with the project
      options:
        - label: This works without adding a runtime dependency.
        - label: This can be driven by semantic HTML with `data-*` / `aria-*` attributes.
